spring.application.name=fitness-monolith



# Database Configuration
spring.datasource.url=${DB_URL:jdbc:h2:mem:fitness_monolith;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PWD:}

spring.jpa.hibernate.ddl-auto=update
# Hibernate detects the dialect from the configured JDBC connection.


spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG
